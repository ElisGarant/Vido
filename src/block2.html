const eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

const C=["Человек остался.","Теперь ему нужно понять, что вы предлагаете и зачем это ему.",
"Nielsen Norman Group, одна из самых известных компаний в исследованиях юзабилити,","изучала, сколько люди остаются на странице.","Больше всего уходят в первые 10 секунд.",
"Их вывод: если за эти 10 секунд человек не понял, что получит,","нескольких минут его внимания у вас не будет.",

"По данным той же Nielsen Norman Group,","люди успевают прочитать примерно четверть текста на странице.","Остальное они пролистывают.",

"Закон Хика, его сформулировали психологи ещё в 1950-х:","чем больше вариантов, тем дольше решение.","А пока человек выбирает, он вполне может закрыть вкладку.","На одном экране оставляйте одно главное действие.",

const cx=s=>200+s*48, cy=y=>820-y*520;

${[0,10,20,30].map(s=>`<text x="${cx(s)}" y="866" fill="#8C8C90" font-size="28" text-anchor="middle" font-family="Noto Sans CJK SC">${s} с</text>`).join('')}

// ---------- E5-A: wall of text, quarter read
const lorem="Компания «Тёплый дом» более десяти лет работает на рынке светопрозрачных конструкций и за это время зарекомендовала себя как надёжный партнёр для частных и корпоративных клиентов. Мы используем профильные системы ведущих европейских производителей, стеклопакеты с энергосберегающим напылением и фурнитуру, прошедшую сертификацию. Каждый проект начинается с консультации и выезда замерщика, который учитывает особенности проёма, стен и откосов. После согласования спецификации изделие изготавливается на собственном производстве с контролем качества на каждом этапе. Монтаж выполняется бригадой с опытом, по ГОСТ, с использованием пароизоляционных лент и качественной монтажной пены. По завершении работ проводится уборка, а клиент получает гарантийный талон и рекомендации по уходу. Также мы предлагаем отделку откосов, установку подоконников, отливов, москитных сеток и сервисное обслуживание окон любых производителей.";
