<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#0C0C0D;--surf:#18181A;--surf2:#202023;--line:#2A2A2D;--red:#E3342F;--red2:#FF5A4F;--ink:#F3F3F3;--mut:#8C8C90}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;background:var(--bg);color:var(--ink);font-family:'Noto Sans CJK SC',sans-serif;overflow:hidden;position:relative}
.L{position:absolute;inset:0;opacity:0}
#bug{position:absolute;top:44px;left:72px;font-weight:900;font-size:28px;z-index:35}
#bug span{color:var(--red)}
#cnt{position:absolute;top:40px;right:72px;font-weight:900;font-size:34px;z-index:35}
#cnt small{color:var(--mut);font-weight:500}
#steps{position:absolute;top:40px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
#steps span{font-size:20px;padding:7px 18px;border-radius:999px;background:#1C1C1F;color:#6A6A6F;font-weight:500}
#steps span.on{background:var(--red);color:#fff}
#ttl{position:absolute;top:108px;left:72px;font-size:26px;color:var(--mut);font-weight:500;z-index:20}
#src{position:absolute;top:104px;right:72px;font-size:19px;color:#B5B5BA;background:#1A1A1D;border:1px solid var(--line);border-radius:10px;padding:8px 16px;z-index:20;opacity:0;white-space:nowrap}
#sub{position:absolute;left:0;right:0;bottom:50px;text-align:center;z-index:40}
#sub span{display:inline-block;font-size:40px;font-weight:700;background:rgba(0,0,0,.75);padding:10px 26px;border-radius:12px;max-width:1600px}
#card{position:absolute;inset:0;z-index:30;background:var(--red);display:flex;flex-direction:column;justify-content:center;padding-left:160px;clip-path:inset(0 0 0 0)}
#card .k{font-size:44px;color:#FFD3CF;font-weight:700}
#card .h{font-size:150px;font-weight:900;line-height:1.05;color:#fff;letter-spacing:-.02em}
/* browser */
.br{position:absolute;border-radius:16px;overflow:hidden;background:#141416;border:1px solid var(--line)}
.br .bar{height:42px;background:#1E1E21;display:flex;align-items:center;gap:8px;padding:0 16px}
.br .bar b{width:11px;height:11px;border-radius:50%;background:#3A3A3E}
.br .url{margin-left:12px;flex:1;height:24px;border-radius:7px;background:#121214;font-size:14px;color:#6E6E73;display:flex;align-items:center;padding:0 12px}
.vp{position:absolute;top:42px;left:0;right:0;bottom:0;overflow:hidden}
/* dark good site, designed at 1160x650 then scaled */
.gs{position:absolute;left:0;top:0;width:1160px;height:650px;background:#111113;transform-origin:0 0}
.gs nav{display:flex;justify-content:space-between;padding:24px 44px;font-size:17px;color:#BDBDC2}
.gs .logo{font-weight:900;color:#fff;font-size:21px}
.gs .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;padding:22px 44px}
.gs h2{font-size:50px;line-height:1.08;font-weight:900;letter-spacing:-.015em}
.gs p{font-size:19px;line-height:1.5;color:#9C9CA1;margin:16px 0 26px}
.gs .cta{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:20px;padding:16px 30px;border-radius:10px}
.gs .img{height:340px;border-radius:16px;background:linear-gradient(160deg,#2B2B2F,#1B1B1E);position:relative;overflow:hidden;border:1px solid var(--line)}
.gs .img i{position:absolute;left:24%;top:15%;width:52%;height:70%;border:12px solid #E9E9EC;border-radius:6px;background:linear-gradient(180deg,#3A3F48,#20232A)}
.gs .img u{position:absolute;left:calc(50% - 6px);top:15%;width:12px;height:70%;background:#E9E9EC}
.gs .trust{display:flex;gap:32px;margin-top:28px;font-size:15px;color:#8C8C90}
.gs .trust b{display:block;font-size:26px;color:#fff}
/* bad site */
.bs{position:absolute;left:0;top:0;width:1160px;height:650px;transform-origin:0 0;background:linear-gradient(180deg,#FFF59A,#FFD84D);font-family:'Liberation Serif',serif;text-align:center;color:#222}
.big{font-weight:900;letter-spacing:-.02em;line-height:1}
.lbl{font-size:30px;color:var(--mut);font-weight:500}
.chip{position:absolute;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 22px;font-size:28px;font-weight:700;white-space:nowrap}
.chip.r{border-color:var(--red);color:var(--red2)}
.bars .row{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.bars .nm{width:420px;font-size:30px;font-weight:700;text-align:right}
.bars .tr{flex:1;height:54px;background:#161618;border-radius:10px;position:relative;overflow:hidden}
.bars .fl{position:absolute;left:0;top:0;bottom:0;border-radius:10px}
.phone{position:absolute;width:300px;height:610px;border-radius:44px;background:#2A2A2D;padding:11px}
.phone .scr{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#111113;position:relative}
.phone .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:84px;height:22px;border-radius:12px;background:#000;z-index:5}
.call{position:absolute;font-size:30px;font-weight:700;opacity:0;white-space:nowrap}
.call small{display:block;font-size:22px;font-weight:500;color:var(--mut)}
.call:before{content:"";position:absolute;left:-26px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--red)}
</style></head><body>
<div id="bug">Eli<span>'</span>s</div>
<div id="steps"><span class="on">Зашёл</span><span>Понял</span><span>Поверил</span><span>Купил</span></div>
<div id="cnt"><span id="cn">1</span><small>/12</small></div>
<div id="ttl"></div>
<div id="src"></div>
<div id="stage"></div>
<div id="card"><div class="k" id="ck"></div><div class="h" id="ch"></div></div>
<div id="sub"><span id="st"></span></div>
